server {
    listen 443 ssl;
    server_name ericjorgensen.com www.ericjorgensen.com;

    ssl_certificate     /etc/letsencrypt/live/ericjorgensen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ericjorgensen.com/privkey.pem;

    root /var/www/portfolio/apps/ericjorgensen/client/dist;
    index index.html;

    # Compress text assets. Ubuntu's default gzip_types is text/html only, so
    # without this every JS bundle ships raw — the Blast Corps physics worker
    # alone is a 3.4 MB script (≈0.9 MB gzipped).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # React SPA — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blast Corps Reimagined runs its physics on every core via SharedArrayBuffer,
    # which needs a cross-origin-isolated document. The headers go on this route's
    # HTML only (they would break embeds elsewhere); `credentialless` keeps gtag
    # and Google Fonts loading. Client-side navigation from / cannot isolate, so
    # the home page links here with a full document load.
    location = /blast-corps-reimagined {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        try_files /index.html =404;
    }

    # Remote MCP endpoint (feature-request insights) → insights service on 3006.
    # Bearer-gated in the app. Streaming-friendly: no buffering, long read
    # timeout, and the mcp-session-id header passes through by default.
    location /mcp {
        proxy_pass http://localhost:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Public, read-only Coding Mentor MCP → mentor service on 3007 (no auth).
    location /coach {
        proxy_pass http://localhost:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # The public feedback panel (e.g. Singadoodle) talks to the shared feedback
    # service on 3005; longest-prefix match wins over the per-app /api/ below.
    location /api/feedback {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The secret feedback admin console (/manage/feedback) talks to the shared
    # feedback service's admin API (longest-prefix match wins over /api/).
    location /api/admin/ {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API to Express
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name ericjorgensen.com www.ericjorgensen.com;
    return 301 https://$host$request_uri;
}
